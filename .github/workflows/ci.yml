name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@1721d98b44b10fec8902969f80fa8b4ee5c06960
    with:
      # THE REASON `msrv-args` EXISTS.
      #
      # This crate declares rust-version 1.70 for the LIBRARY, and that promise is
      # real: `cargo +1.70 build --no-default-features` succeeds. But the default
      # `cli` feature pulls clap, whose own graph needs far more (at 1.70 the
      # build dies on `quote v1.0.45 requires rustc 1.72`). Verifying the promise
      # therefore means building WITHOUT the default features.
      #
      # Before this input the MSRV job would have failed on a correct repo, and
      # the only escape was raising a published floor downstreams pin against --
      # weakening a real promise to satisfy CI. `msrv-args` carrying its own
      # feature selection also REPLACES the automatic --all-features, because
      # cargo rejects `--all-features --no-default-features` and that rejection
      # reads as a broken floor rather than a broken invocation.
      msrv-args: "--no-default-features"
      # Coverage is a FLOOR, and the number is measured: LINE coverage is 88.79%
      # with binaries excluded, read from `cargo llvm-cov --json` rather than the
      # summary table, whose first percentage column is regions. There was no
      # coverage gate here before, so a floor this repo meets is the honest
      # starting point; raising it is follow-up work with a number to move.
      coverage-gate: floor
      coverage-floor: 88
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)'
